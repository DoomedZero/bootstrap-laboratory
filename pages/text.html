<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>p11</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container w-25 my-lg-5">
        <h1 class="h4">
            Personal Information
        </h1>
        <div class="input-group mb-3">
            <span class="input-group-text">
                Name 
            </span>
            <input class="form-control" type="text" name="" id="">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">
                DOB
            </span>
            <input class="form-control" type="date" name="" id="">
        </div>
         <div class="input-group mb-3">
            <span class="input-group-text">
                Contact 
            </span>
            <input class="form-control" type="tel" name="" id="">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">
                Email 
            </span>
            <input class="form-control" type="email" name="" id="">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">
                Address 
            </span>
            <input class="form-control" type="text" name="" id="">
        </div>
        <h1 class="h4 mt-3">
            Employment Information
        </h1>
        <div class="input-group mb-3">
            <span class="input-group-text">
                Desired Job Title 
            </span>
            <input class="form-control" type="text" name="" id="">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">
                Desired Salary 
            </span>
            <input class="form-control" type="number" name="" id="">
        </div>
        <div class="mb-3">
             <label class="form-label d-block">Availability</label>
                <!-- Male Radio -->
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male">
                    <label class="form-check-label" for="genderMale">Full-Time</label>
                </div>
                
                <!-- Female Radio -->
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                    <label class="form-check-label" for="genderFemale">Part-Time</label>
                </div>

                <!-- Other/Prefer not to say (Optional) -->
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                    <label class="form-check-label" for="genderOther">Other</label>
                </div>
        </div>
        <div class="mb-3">
             <label class="form-label d-block">Willingness to relocate?</label>
                <!-- Yes Radio -->
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male">
                    <label class="form-check-label" for="genderMale">Yes</label>
                </div>
                
                <!-- No Radio -->
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                    <label class="form-check-label" for="genderFemale">No</label>
                </div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        
    </div>
</body>
</html>
