<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical-9</title>
    <link rel="icon" href="../src/bootstrap-logo.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="back-button.css">
</head>

<body>

    <a href="../index.html" class="lab-home-link">
        <span aria-hidden="true">←</span>
        <span>Bootstrap Laboratory</span>
    </a>

    <div class="container my-4">
        <div class="card shadow-sm mx-auto" style="max-width: 650px;">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-1"><i class="bi bi-briefcase-fill me-2"></i>Job Application Form</h4>
                <p class="mb-0 small">Apply for your desired position</p>
            </div>

            <div class="card-body p-4">
                <form>
                    <!-- Personal Information -->
                    <h6 class="text-primary mb-3">
                        <i class="bi bi-person-fill me-2"></i>Personal Information
                    </h6>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter full name"
                                required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="dob" class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="dob" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" placeholder="Enter phone number" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label">Current Address</label>
                        <textarea class="form-control" id="address" rows="2" placeholder="Enter your address"
                            required></textarea>
                    </div>

                    <hr>

                    <!-- Job Information -->
                    <h6 class="text-primary mb-3">
                        <i class="bi bi-building me-2"></i>Job Information
                    </h6>

                    <div class="mb-3">
                        <label for="position" class="form-label">Position Applied For</label>
                        <select class="form-select" id="position" required>
                            <option value="" selected disabled>Select a position</option>
                            <option>Web Developer</option>
                            <option>Software Engineer</option>
                            <option>UI/UX Designer</option>
                            <option>Data Analyst</option>
                            <option>Marketing Executive</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="experience" class="form-label">Work Experience</label>
                            <select class="form-select" id="experience" required>
                                <option value="" selected disabled>Select experience</option>
                                <option>Fresher</option>
                                <option>Less than 1 year</option>
                                <option>1–3 years</option>
                                <option>3–5 years</option>
                                <option>5+ years</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="salary" class="form-label">Expected Salary (per year)</label>
                            <input type="number" class="form-control" id="salary" placeholder="e.g. 500000" min="0">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="joiningDate" class="form-label">Available Joining Date</label>
                        <input type="date" class="form-control" id="joiningDate">
                    </div>

                    <hr>

                    <!-- Education -->
                    <h6 class="text-primary mb-3">
                        <i class="bi bi-mortarboard-fill me-2"></i>Education
                    </h6>

                    <div class="mb-3">
                        <label for="qualification" class="form-label">Highest Qualification</label>
                        <select class="form-select" id="qualification" required>
                            <option value="" selected disabled>Select qualification</option>
                            <option>High School</option>
                            <option>Diploma</option>
                            <option>Bachelor's Degree</option>
                            <option>Master's Degree</option>
                            <option>PhD</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="skills" class="form-label">Key Skills</label>
                        <textarea class="form-control" id="skills" rows="2"
                            placeholder="e.g. HTML, CSS, JavaScript, Communication"></textarea>
                    </div>

                    <!-- Resume -->
                    <div class="mb-3">
                        <label for="resume" class="form-label">Upload Resume (PDF)</label>
                        <input type="file" class="form-control" id="resume" accept=".pdf,application/pdf" required>
                        <div class="form-text">Please upload your resume in PDF format.</div>
                    </div>

                    <!-- Declaration -->
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="declaration" required>
                        <label class="form-check-label" for="declaration">
                            I confirm that the information provided is accurate.
                        </label>
                    </div>

                    <!-- Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            <i class="bi bi-send-fill me-2"></i>Submit Application
                        </button>

                        <button type="reset" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
                        </button>
                    </div>
                </form>
            </div>

            <div class="card-footer text-center text-muted small">
                <i class="bi bi-shield-check me-1"></i>Your information will be treated confidentially.
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
