<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical-9</title>
    <link rel="icon" href="../src/bootstrap-logo.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="back-button.css">
</head>

<body>

    <a href="../index.html" class="lab-home-link">
        <span aria-hidden="true">←</span>
        <span>Bootstrap Laboratory</span>
    </a>

    <div class="container py-4">

        <h2 class="text-center mb-4">Job Application Form</h2>

        <form>

            <!-- Personal Information -->
            <h5 class="mb-3">Personal Information</h5>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Enter first name" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" placeholder="Enter last name" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" rows="2" placeholder="Enter your address"></textarea>
            </div>

            <!-- Job Information -->
            <h5 class="mt-4 mb-3">Job Information</h5>

            <div class="mb-3">
                <label for="position" class="form-label">Position Applied For</label>
                <select class="form-select" id="position" required>
                    <option value="">Select a position</option>
                    <option>Web Developer</option>
                    <option>Software Engineer</option>
                    <option>UI/UX Designer</option>
                    <option>Data Analyst</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="experience" class="form-label">Work Experience</label>
                <select class="form-select" id="experience" required>
                    <option value="">Select experience</option>
                    <option>Fresher</option>
                    <option>1-2 Years</option>
                    <option>3-5 Years</option>
                    <option>More than 5 Years</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Employment Type</label>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="employmentType" id="fullTime" value="Full-time">
                    <label class="form-check-label" for="fullTime">Full-time</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="employmentType" id="partTime" value="Part-time">
                    <label class="form-check-label" for="partTime">Part-time</label>
                </div>

                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="employmentType" id="internship"
                        value="Internship">
                    <label class="form-check-label" for="internship">Internship</label>
                </div>
            </div>
            <!-- Resume Upload -->
            <div class="mb-3">
                <label for="resume" class="form-label">Upload Resume</label>
                <input type="file" class="form-control" id="resume" accept=".pdf,.doc,.docx">
            </div>

            <!-- Declaration -->
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="declaration" required>
                <label class="form-check-label" for="declaration">
                    I confirm that the information provided is correct.
                </label>
            </div>

            <!-- Buttons -->
            <button type="submit" class="btn btn-primary">Submit Application</button>
            <button type="reset" class="btn btn-secondary">Reset Form</button>

        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
