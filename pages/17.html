<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical-17</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="back-button.css">
</head>

<body>

    <a href="../index.html" class="lab-home-link">
        <span aria-hidden="true">←</span>
        <span>Bootstrap Laboratory</span>
    </a>

    <div class="container py-5">

        <h2 class="text-center mb-4">
            Practical 17: Modal Dialogs
        </h2>

        <h4>Student Records</h4>

        <table class="table table-bordered mt-3">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr id="recordRow">
                    <td>1</td>
                    <td>John Doe</td>
                    <td>CE</td>
                    <td>
                        <button class="btn btn-success btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#saveModal">
                            Save Record
                        </button>

                        <button class="btn btn-danger btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#deleteModal">
                            Delete Record
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- Save Confirmation Modal -->
    <div class="modal fade" id="saveModal" tabindex="-1"
        aria-labelledby="saveModalLabel" aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="saveModalLabel">
                        Save Record
                    </h5>

                    <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    Are you sure you want to save this student record?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="button" class="btn btn-success"
                        data-bs-dismiss="modal"
                        onclick="saveRecord()">
                        Yes, Save
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1"
        aria-labelledby="deleteModalLabel" aria-hidden="true">

        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">
                        Delete Record
                    </h5>

                    <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    Are you sure you want to delete this student record?
                    This action cannot be undone.
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>

                    <button type="button" class="btn btn-danger"
                        data-bs-dismiss="modal"
                        onclick="deleteRecord()">
                        Yes, Delete
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Result Message -->
    <div class="container">
        <div id="resultMessage" class="alert alert-info d-none"
            role="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function saveRecord() {
            const message = document.getElementById("resultMessage");

            message.textContent = "Student record saved successfully!";
            message.className = "alert alert-success";
        }

        function deleteRecord() {
            const row = document.getElementById("recordRow");
            const message = document.getElementById("resultMessage");

            row.remove();

            message.textContent = "Student record deleted successfully!";
            message.className = "alert alert-danger";
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
