<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical-7</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
  <div class="container my-4">
    <div class="d-flex flex-wrap gap-3 align-items-center">

      <!-- Basic Dropdown -->
      <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-list me-2"></i>Basic Menu
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#"><i class="bi bi-house me-2"></i>Home</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
        </ul>
      </div>

      <!-- Right-Aligned Dropdown -->
      <div class="dropdown">
        <button class="btn btn-success dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-three-dots-vertical me-2"></i>Right Aligned
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#"><i class="bi bi-pencil me-2"></i>Edit</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-share me-2"></i>Share</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-trash me-2"></i>Delete</a></li>
        </ul>
      </div>

      <!-- Dropup Menu -->
      <div class="dropup">
        <button class="btn btn-warning dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-arrow-up-circle me-2"></i>Dropup Menu
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#"><i class="bi bi-file-earmark me-2"></i>New File</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-folder me-2"></i>New Folder</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-upload me-2"></i>Upload</a></li>
        </ul>
      </div>

      <!-- Menu with Headers and Dividers -->
      <div class="dropdown">
        <button class="btn btn-info dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-collection me-2"></i>Grouped Menu
        </button>
        <ul class="dropdown-menu">
          <li>
            <h6 class="dropdown-header">Account</h6>
          </li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-person-circle me-2"></i>My Profile</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-shield-lock me-2"></i>Privacy</a></li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <h6 class="dropdown-header">Preferences</h6>
          </li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-palette me-2"></i>Appearance</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-bell me-2"></i>Notifications</a></li>
        </ul>
      </div>

      <!-- Disabled Item -->
      <div class="dropdown">
        <button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
          <i class="bi bi-sliders me-2"></i>More Options
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#"><i class="bi bi-download me-2"></i>Download</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-printer me-2"></i>Print</a></li>
          <li><a class="dropdown-item disabled" href="#" tabindex="-1" aria-disabled="true">
              <i class="bi bi-lock me-2"></i>Unavailable
            </a></li>
        </ul>
      </div>

      <!-- Split Button Dropdown -->
      <div class="btn-group">
        <button type="button" class="btn btn-danger">
          <i class="bi bi-cloud-arrow-down me-2"></i>Download
        </button>
        <button type="button" class="btn btn-danger dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown"
          aria-expanded="false">
          <span class="visually-hidden">Toggle Dropdown</span>
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#"><i class="bi bi-filetype-pdf me-2"></i>PDF</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-filetype-csv me-2"></i>CSV</a></li>
          <li><a class="dropdown-item" href="#"><i class="bi bi-filetype-txt me-2"></i>Text File</a></li>
        </ul>
      </div>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
